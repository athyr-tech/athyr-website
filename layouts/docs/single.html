{{ define "styles" }}
<link rel="stylesheet" href="/css/pages/docs.css">
{{ end }}

{{ define "main" }}
<div class="docs-layout">
  {{ partial "docs-nav.html" . }}

  <!-- Content -->
  <main class="docs-content">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>

  <!-- Table of Contents -->
  {{ if .TableOfContents }}
  <aside class="docs-toc">
    <h4 class="docs-toc-title">On This Page</h4>
    {{ .TableOfContents }}
  </aside>
  {{ end }}
</div>
{{ end }}
