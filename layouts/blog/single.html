{{ define "styles" }}
<link rel="stylesheet" href="/css/pages/blog.css">
{{ end }}

{{ define "main" }}
<div class="blog-layout">
  <article class="blog-post">
    <header class="blog-post-header">
      <a href="/blog/" class="blog-post-back">&larr; Blog</a>
      <div class="blog-post-meta">
        <time>{{ .Date.Format "January 2, 2006" }}</time>
        <span class="blog-entry-dot">&middot;</span>
        <span>{{ math.Round (div (countwords .Content) 200.0) }} min read</span>
      </div>
      <h1>{{ .Title }}</h1>
      {{ with .Params.tags }}
      <div class="blog-tags">
        {{ range . }}
        <a href="/tags/{{ . | urlize }}/" class="blog-tag">{{ . }}</a>
        {{ end }}
      </div>
      {{ end }}
    </header>

    <div class="blog-post-content">
      {{ .Content }}
    </div>

    <footer class="blog-post-footer">
      <a href="/blog/" class="blog-post-back">&larr; Back to all posts</a>
    </footer>
  </article>
</div>
{{ end }}
